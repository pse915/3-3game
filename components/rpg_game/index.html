<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>서라벌여중 · 나의 미래 다이어리</title><link rel="stylesheet" href="style.css"></head><body>
<main id="game"><canvas id="world" aria-label="방향패드로 이동하는 역할 놀이 게임 화면"></canvas>
<header><div class="brand"><span class="seal">서</span><div><small>서라벌여중 · 미래 다이어리</small><b id="location">서라벌여중</b></div></div><span id="lifeBadge"></span><div id="time">나의 첫 번째 페이지</div><button id="storyBtn" class="story-button">📔 스토리</button><button id="activityBtn">활동</button><button id="menuBtn" aria-label="게임 메뉴 열기">메뉴</button><button id="diaryBtn">다이어리</button></header>
<aside id="mission" aria-label="메인 퀘스트 안내"><div class="mission-head"><small>★ <span id="missionCaption">현재 목표</span> <span id="missionProgress"></span></small><button id="missionToggle" aria-expanded="true" aria-controls="missionDetails" aria-label="안내 접기">−</button></div><div id="missionDetails"><strong id="objective">다음 이야기의 별표를 찾아보세요</strong><span id="hint">노란 별표를 따라가면 됩니다.</span><div id="missionHelp" role="status" aria-live="polite"></div><div class="mission-actions"><button id="guideBtn" class="quest-action">★ 길 안내</button><button id="missionMapBtn">지도 보기</button></div><button id="missionJumpBtn" hidden>목표 근처로 이동</button></div></aside>
<canvas id="minimap" width="144" height="144" aria-label="현재 지역 미니맵"></canvas>
<div id="toast" role="status"></div><div id="prompt"></div>
<footer><span id="saveStatus">기기 저장 준비</span><span id="perf"></span></footer>
<nav id="controls" aria-label="터치 게임 조작"><div id="pad"><button data-dir="up" aria-label="위로">▲</button><button data-dir="left" aria-label="왼쪽으로">◀</button><span></span><button data-dir="right" aria-label="오른쪽으로">▶</button><button data-dir="down" aria-label="아래로">▼</button></div><div class="actions"><button id="runBtn" aria-pressed="false">달리기</button><button id="actBtn">이야기<br><small>상호작용</small></button></div></nav>
<section id="overlay" class="shade"><div class="title-card"><span class="eyebrow">걸어가며 쓰는, 나만의 이야기</span><h1>서라벌여중<span>나의 미래 다이어리 v5.3</span></h1><p>익숙한 학교에서 시작해<br>아직 정해지지 않은 나의 내일로.</p><div class="character-row" id="characters"></div><button id="titleLanguageBtn" class="language-entry">🌐 언어 / Язык</button><button class="primary" id="startBtn">첫 페이지 펼치기</button><button id="continueBtn" hidden>이어서 걷기</button><small class="note">15세에서 65세까지 · 20분의 생애 여행<br>서로 다른 선택을 해도 좋아요. 어떤 삶을 준비하고 싶은가요?</small></div></section>
<dialog id="modal"><button id="quickLanguageBtn" class="language-quick" aria-label="언어 변경 / Сменить язык">🌐 한국어 / Русский</button><div id="modalBody"></div><button id="closeModal">닫기 · 돌아가기</button></dialog>
</main><script type="module" src="game.js?v=5.3"></script></body></html>
